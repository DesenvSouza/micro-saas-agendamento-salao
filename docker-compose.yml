version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salonbooking-sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Password123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourStrong@Password123" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: SalonBooking.API/Dockerfile
    container_name: salonbooking-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SalonBooking;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=true;MultipleActiveResultSets=true
      - Jwt__Secret=CHANGE-THIS-TO-A-256-BIT-SECRET-KEY-IN-PRODUCTION-ENVIRONMENT
      - Jwt__Issuer=SalonBookingAPI
      - Jwt__Audience=SalonBookingClient
      - Jwt__ExpirationMinutes=60
      - Jwt__RefreshExpirationDays=30
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
